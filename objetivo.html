<!-- ================= CONTENIDO ================= -->

<main class="main-content">

    <header class="topbar">

        <div>

            <h1>🎯 Mis Objetivos</h1>

            <p>Configura tus metas para comenzar un estilo de vida saludable.</p>

        </div>

    </header>

    <div class="panel">

        <h2>Configurar Objetivos</h2>

        <form class="goal-form">

            <div class="input-group">

                <label>Peso actual (kg)</label>

                <input type="number" placeholder="Ejemplo: 75">

            </div>

            <div class="input-group">

                <label>Peso objetivo (kg)</label>

                <input type="number" placeholder="Ejemplo: 68">

            </div>

            <div class="input-group">

                <label>Objetivo principal</label>

                <select>

                    <option>Perder peso</option>

                    <option>Ganar masa muscular</option>

                    <option>Mantener mi peso</option>

                    <option>Mejorar mi alimentación</option>

                </select>

            </div>

            <div class="input-group">

                <label>Tiempo estimado</label>

                <select>

                    <option>1 mes</option>

                    <option>2 meses</option>

                    <option>3 meses</option>

                    <option>6 meses</option>

                </select>

            </div>

            <div class="input-group">

                <label>Nivel de actividad física</label>

                <select>

                    <option>Sedentario</option>

                    <option>Ligero</option>

                    <option>Moderado</option>

                    <option>Activo</option>

                </select>

            </div>

            <button type="submit" class="save-btn">

                Guardar Objetivos

            </button>

        </form>

    </div>

</main>

<script src="objetivo.js"></script>
